<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>Hiro-chan Tactile Visualizer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(18, 18, 18, 0.85);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.6;
      z-index: 10;
      min-width: 180px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hud-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      color: #4fc3f7;
    }

    .hud-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }

    .badge-connected {
      background: #2e7d32;
      color: #fff;
    }

    .badge-disconnected {
      background: #c62828;
      color: #fff;
    }

    .bar-container {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }

    #pressure-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #ffea00, #ff1744);
      transition: width 0.05s ease-out;
    }

    #rec-btn {
      margin-top: 12px;
      width: 100%;
      padding: 6px 14px;
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    #rec-btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>

<body>
  <div id="hud">
    <div class="hud-title">Hiro-chan Tactile Vis</div>
    <div>Status: <span id="status-badge" class="hud-badge badge-disconnected">Connecting</span></div>
    <div class="bar-container">
      <div id="pressure-bar"></div>
    </div>
    <button id="rec-btn">● Record Bag</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
